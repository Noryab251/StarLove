<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro universo</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at bottom, #020824, #00010a);
  overflow: hidden;
  color: white;
}

/* Texto inicial */
.contenido {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 2;
}
h1 { font-size: 3rem; }
p { opacity: 0.85; }

/* Estrellas de fondo */
.estrella {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.6;
  animation: parpadeo 2s infinite alternate;
}
@keyframes parpadeo {
  from { opacity: 0.3; }
  to { opacity: 1; }
}

/* Estrellas especiales (constelación) */
.estrella.especial {
  width: 8px;
  height: 8px;
  background: #e8f7ff;
  box-shadow: 0 0 12px #9fdcff;
  cursor: pointer;
  z-index: 3;
}
.estrella.especial.activa {
  background: #b8ecff;
  box-shadow: 0 0 18px #b8ecff;
}

/* Líneas */
.linea {
  position: absolute;
  height: 1.5px;
  background: rgba(160,220,255,0.8);
  transform-origin: 0 50%;
  z-index: 1;
}

/* Popup */
.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  padding: 20px 30px;
  border-radius: 14px;
  font-size: 1.2rem;
  z-index: 10;
}
.oculto { display: none; }
</style>
</head>

<body>

<div class="contenido">
  <h1>Nuestro universo ✨</h1>
  <p>Un cielo hecho con calma,<br>estrella por estrella.</p>
</div>

<!-- Constelación del Cisne -->
<div class="estrella especial" style="top:25%; left:50%;" data-id="a"></div>
<div class="estrella especial" style="top:35%; left:48%;" data-id="b"></div>
<div class="estrella especial" style="top:45%; left:46%;" data-id="c"></div>
<div class="estrella especial" style="top:55%; left:48%;" data-id="d"></div>
<div class="estrella especial" style="top:65%; left:50%;" data-id="e"></div>

<!-- Popup -->
<div id="popup" class="popup oculto">
  <p id="popup-text"></p>
</div>

<script>
/* Estrellas de fondo */
for (let i = 0; i < 140; i++) {
  const e = document.createElement("div");
  e.className = "estrella";
  const s = Math.random() * 2 + 1;
  e.style.width = s + "px";
  e.style.height = s + "px";
  e.style.top = Math.random() * 100 + "vh";
  e.style.left = Math.random() * 100 + "vw";
  e.style.animationDuration = (Math.random()*3+1)+"s";
  document.body.appendChild(e);
}

/* Constelación */
const estrellas = document.querySelectorAll(".estrella.especial");
let activadas = [];
let lineas = [];

estrellas.forEach(e => {
  e.addEventListener("click", () => {
    if (e.classList.contains("activa")) return;

    e.classList.add("activa");
    activadas.push(e);

    if (activadas.length > 1) {
      conectar(activadas[activadas.length-2], e);
    }

    if (activadas.length === estrellas.length) {
      setTimeout(() => {
        conectar(activadas[activadas.length-1], activadas[0]);
        mostrarMensaje();
      }, 600);
    }
  });
});

function conectar(a, b) {
  const r1 = a.getBoundingClientRect();
  const r2 = b.getBoundingClientRect();

  const x1 = r1.left + r1.width/2;
  const y1 = r1.top + r1.height/2;
  const x2 = r2.left + r2.width/2;
  const y2 = r2.top + r2.height/2;

  const dx = x2 - x1;
  const dy = y2 - y1;
  const dist = Math.sqrt(dx*dx + dy*dy);
  const ang = Math.atan2(dy, dx) * 180/Math.PI;

  const l = document.createElement("div");
  l.className = "linea";
  l.style.left = x1+"px";
  l.style.top = y1+"px";
  l.style.transform = `rotate(${ang}deg)`;
  l.style.width = "0px";

  document.body.appendChild(l);

  let w = 0;
  const anim = setInterval(() => {
    w += dist/30;
    l.style.width = w+"px";
    if (w >= dist) clearInterval(anim);
  }, 16);
}

function mostrarMensaje() {
  const popup = document.getElementById("popup");
  document.getElementById("popup-text").textContent =
    "Así como estas estrellas se unen,\nmi mundo también se completa contigo 💫";
  popup.classList.remove("oculto");
}

document.getElementById("popup").onclick = () =>
  document.getElementById("popup").classList.add("oculto");
</script>

</body>
</html>

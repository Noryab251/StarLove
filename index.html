<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro universo</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Arial',sans-serif;
}
body{
  height:100vh;
  background:radial-gradient(circle at bottom,#070b1f,#00010a);
  overflow:hidden;
  color:white;
}

/* Texto arriba */
.contenido{
  position:absolute;
  top:40px;
  width:100%;
  text-align:center;
  z-index:2;
  pointer-events:none;
}
h1{font-size:2.8rem;margin-bottom:10px;}
p{font-size:1.2rem;opacity:.85;}

/* estrellas fondo */
.estrella{
  position:absolute;
  background:white;
  border-radius:50%;
  opacity:.7;
  animation:parpadeo 2s infinite alternate;
}
@keyframes parpadeo{
  from{opacity:.3;}
  to{opacity:1;}
}

/* estrellas especiales */
.estrella.especial{
  width:7px;
  height:7px;
  background:#e6f2ff;
  border-radius:50%;
  position:absolute;
  cursor:pointer;
  z-index:3;
  box-shadow:0 0 6px rgba(180,220,255,.9),
              0 0 12px rgba(120,180,255,.6);
  animation:latido 2.5s infinite ease-in-out;
}
@keyframes latido{
  0%,100%{transform:scale(1);opacity:.9;}
  50%{transform:scale(1.25);opacity:1;}
}
.estrella.especial.activa{
  background:#fff;
  box-shadow:0 0 10px #fff,
              0 0 20px rgba(200,220,255,1);
}

/* líneas */
.linea{
  position:absolute;
  height:1.2px;
  background:rgba(200,220,255,.8);
  transform-origin:0 50%;
  z-index:2;
  width:0;
  animation:dibujar 1s ease-out forwards;
  box-shadow:0 0 6px rgba(180,200,255,.6);
}
@keyframes dibujar{
  from{width:0;}
  to{width:var(--longitud);}
}

/* popup */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,.85);
  padding:22px 28px;
  border-radius:14px;
  font-size:1.2rem;
  max-width:80%;
  text-align:center;
  z-index:10;
  cursor:pointer;
}
.oculto{display:none;}
</style>
</head>

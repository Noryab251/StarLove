<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro universo ✨</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
  height:100vh;
  background: radial-gradient(circle at center, #0a0e29 0%, #00010a 100%);
  overflow:hidden;
  color:white;
}

.contenido{
  position:absolute;
  top:40px;
  width:100%;
  text-align:center;
  z-index:2;
  pointer-events:none;
}
h1{font-size:2.5rem; margin-bottom:10px; text-shadow: 0 0 15px rgba(255,255,255,0.5);}
p{font-size:1.1rem; opacity:.8; letter-spacing: 1px;}

/* Estrellas de fondo */
.estrella{
  position:absolute;
  background:white;
  border-radius:50%;
  opacity:.5;
  animation:parpadeo var(--d) infinite alternate;
}
@keyframes parpadeo{
  from{opacity:.2; transform: scale(0.8);}
  to{opacity:.8; transform: scale(1.2);}
}

/* Estrellas de las constelaciones */
.estrella.especial{
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  cursor:pointer;
  z-index:3;
  box-shadow:0 0 10px #fff, 0 0 20px rgba(120,180,255,0.8);
  transition: transform 0.3s;
}
.estrella.especial:hover { transform: scale(1.5); }
.estrella.especial.activa{
  background:#00f2ff;
  box-shadow:0 0 15px #00f2ff, 0 0 30px #00f2ff;
}

/* Líneas de conexión */
.linea{
  position:absolute;
  height:1.5px;
  background: linear-gradient(90deg, #00f2ff, rgba(255,255,255,0.2));
  transform-origin:0 50%;
  z-index:2;
  width:0;
  animation:dibujar 0.8s ease-out forwards;
}
@keyframes dibujar{ to{width:var(--longitud);} }

/* Popup de mensajes */
.popup{
  position:fixed;
  bottom:50px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  padding:15px 30px;
  border-radius:50px;
  border: 1px solid rgba(255,255,255,0.2);
  font-size:1.1rem;
  z-index:10;
  cursor:pointer;
  animation: fadeIn 0.5s;
}
@keyframes fadeIn { from{opacity:0; bottom:30px;} to{opacity:1; bottom:50px;} }
.oculto{display:none;}
</style>
</head>
<body>

<div class="contenido">
  <h1>Nuestro universo ✨</h1>
  <p>El Triángulo de Verano: un puente entre nosotros.</p>
</div>

<div class="estrella especial" style="top:20%; left:30%;" data-const="lira" data-message="Eres mi estrella Vega, la que más brilla 🎵"></div>
<div class="estrella especial" style="top:25%; left:33%;" data-const="lira" data-message="Nuestra melodía nunca termina"></div>
<div class="estrella especial" style="top:32%; left:32%;" data-const="lira" data-message="Cada nota es un recuerdo contigo"></div>
<div class="estrella especial" style="top:30%; left:28%;" data-const="lira" data-message="Contigo todo suena mejor"></div>
<div class="estrella especial" style="top:23%; left:27%;" data-const="lira" data-message="Un compás perfecto 🎶"></div>

<div class="estrella especial" style="top:15%; left:50%;" data-const="cisne" data-message="Deneb marca el inicio de este viaje ✨"></div>
<div class="estrella especial" style="top:30%; left:50%;" data-const="cisne" data-message="En el centro de mi pecho estás tú"></div>
<div class="estrella especial" style="top:55%; left:50%;" data-const="cisne" data-message="Albireo: donde nuestros mundos se unen"></div>
<div class="estrella especial" style="top:30%; left:35%;" data-const="cisne" data-message="Extendiendo las alas para protegerte"></div>
<div class="estrella especial" style="top:30%; left:65%;" data-const="cisne" data-message="Volando siempre hacia el mismo destino"></div>

<div class="estrella especial" style="top:65%; left:70%;" data-const="aguila" data-message="Altair: mi guía en la oscuridad 🦅"></div>
<div class="estrella especial" style="top:60%; left:67%;" data-const="aguila" data-message="Me haces sentir libre"></div>
<div class="estrella especial" style="top:70%; left:73%;" data-const="aguila" data-message="Vuelo alto cuando estás cerca"></div>
<div class="estrella especial" style="top:80%; left:65%;" data-const="aguila" data-message="Mi cielo favorito eres tú"></div>
<div class="estrella especial" style="top:75%; left:55%;" data-const="aguila" data-message="Siempre regreso a tu lado"></div>

<div id="popup" class="popup oculto">
  <p id="popup-text"></p>
</div>

<script>
/* Crear fondo de estrellas aleatorias */
for(let i=0; i<150; i++){
  const e=document.createElement("div");
  e.className="estrella";
  const s=Math.random()*2+1;
  e.style.width=s+"px";
  e.style.height=s+"px";
  e.style.top=Math.random()*100+"vh";
  e.style.left=Math.random()*100+"vw";
  e.style.setProperty('--d', (Math.random()*3+2)+'s');
  document.body.appendChild(e);
}

const progreso={cisne:[],lira:[],aguila:[]};
let completadas=new Set();

document.querySelectorAll(".estrella.especial").forEach(e=>{
  e.addEventListener("click",()=>{
    if(e.classList.contains("activa")) return;

    const grupo=e.dataset.const;
    e.classList.add("activa");

    const popup=document.getElementById("popup");
    document.getElementById("popup-text").textContent=e.dataset.message;
    popup.classList.remove("oculto");

    progreso[grupo].push(e);

    // Lógica de conexión manual para mantener la forma real
    if(progreso[grupo].length > 1) {
      conectar(progreso[grupo][progreso[grupo].length-2], e);
    }

    const total=document.querySelectorAll(`[data-const="${grupo}"]`).length;
    if(progreso[grupo].length === total){
      setTimeout(()=>{
        // Cerrar la figura según la constelación
        if(grupo==='lira' || grupo==='cisne') conectar(progreso[grupo][total-1], progreso[grupo][0]);
        
        completadas.add(grupo);
        if(completadas.size === 3){
          document.getElementById("popup-text").textContent="🌌 Mi universo está completo contigo. El Triángulo de Verano ahora brilla para nosotros. 💙";
        }
      }, 500);
    }
  });
});

function conectar(a,b){
  const r1=a.getBoundingClientRect();
  const r2=b.getBoundingClientRect();
  const x1=r1.left+r1.width/2;
  const y1=r1.top+r1.height/2;
  const x2=r2.left+r2.width/2;
  const y2=r2.top+r2.height/2;

  const dx=x2-x1;
  const dy=y2-y1;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const ang=Math.atan2(dy,dx)*180/Math.PI;

  const l=document.createElement("div");
  l.className="linea";
  l.style.setProperty("--longitud",dist+"px");
  l.style.left=x1+"px";
  l.style.top=y1+"px";
  l.style.transform=`rotate(${ang}deg)`;
  document.body.appendChild(l);
}

document.getElementById("popup").addEventListener("click",()=>document.getElementById("popup").classList.add("oculto"));
</script>
</body>
</html>

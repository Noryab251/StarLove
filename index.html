<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuestro universo</title>

  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at bottom, #0b1d3a, #02040f);
      overflow: hidden;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .contenido {
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.85;
    }

    /* Estrellas de fondo */
    .estrella {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: parpadeo 2s infinite alternate;
    }

    @keyframes parpadeo {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    /* ⭐ Estrellas especiales */
    .estrella.especial {
      width: 4px;
      height: 4px;
      box-shadow: 0 0 10px white;
      cursor: pointer;
      z-index: 3;
    }

    .estrella.especial.activa {
      background: #ffd6ff;
      box-shadow: 0 0 18px #ffd6ff;
    }

    /* Popup */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 20px 30px;
      border-radius: 12px;
      font-size: 1.2rem;
      max-width: 80%;
      z-index: 10;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>
  <div class="contenido">
    <h1>Nuestro universo ✨</h1>
    <p>
      Algo solo y único para ti.<br>
      Poco a poco lo convertiremos en algo increíble.
    </p>
  </div>

  <!-- ⭐ Estrellas románticas clickeables -->
  <div class="estrella especial" style="top:30%; left:40%;" data-message="Desde que llegaste, mi universo cambió ✨"></div>
  <div class="estrella especial" style="top:55%; left:60%;" data-message="Cada estrella me recuerda a ti 💫"></div>
  <div class="estrella especial" style="top:45%; left:25%;" data-message="Eres mi lugar seguro en este infinito 💙"></div>

  <!-- Popup -->
  <div id="popup" class="popup oculto">
    <p id="popup-text"></p>
  </div>

  <!-- 🌌 Estrellas de fondo -->
  <script>
    const cantidad = 120;
    for (let i = 0; i < cantidad; i++) {
      const estrella = document.createElement("div");
      estrella.className = "estrella";

      const size = Math.random() * 2 + 1;
      estrella.style.width = size + "px";
      estrella.style.height = size + "px";
      estrella.style.top = Math.random() * 100 + "vh";
      estrella.style.left = Math.random() * 100 + "vw";
      estrella.style.animationDuration = (Math.random() * 3 + 1) + "s";

      document.body.appendChild(estrella);
    }
  </script>

  <!-- 💙 Interacción romántica -->
  <script>
    const especiales = document.querySelectorAll(".estrella.especial");
    const popup = document.getElementById("popup");
    const popupText = document.getElementById("popup-text");

    especiales.forEach(e => {
      e.addEventListener("click", () => {
        popupText.textContent = e.dataset.message;
        popup.classList.remove("oculto");
        e.classList.add("activa");
      });
    });

    popup.addEventListener("click", () => {
      popup.classList.add("oculto");
    });
  </script>
</body>
</html>

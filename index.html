<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro universo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{
  height:100vh;
  background:radial-gradient(circle at bottom,#070b1f,#00010a);
  overflow:hidden;
  color:white;
}
.contenido{
  position:absolute;
  top:40px;
  width:100%;
  text-align:center;
  z-index:2;
  pointer-events:none;
}
h1{font-size:2.8rem;margin-bottom:10px;}
p{font-size:1.2rem;opacity:.85;}

.estrella{
  position:absolute;
  background:white;
  border-radius:50%;
  opacity:.7;
  animation:parpadeo 2s infinite alternate;
}
@keyframes parpadeo{from{opacity:.3;}to{opacity:1;}}

.estrella.especial{
  width:7px;height:7px;
  background:#e6f2ff;
  border-radius:50%;
  position:absolute;
  cursor:pointer;
  z-index:3;
  box-shadow:0 0 6px rgba(180,220,255,.9),
             0 0 12px rgba(120,180,255,.6);
  animation:latido 2.5s infinite ease-in-out;
}
@keyframes latido{
  0%,100%{transform:scale(1);opacity:.9;}
  50%{transform:scale(1.25);opacity:1;}
}
.estrella.especial.activa{
  background:#fff;
  box-shadow:0 0 10px #fff,0 0 20px rgba(200,220,255,1);
}

.linea{
  position:absolute;
  height:1.2px;
  background:rgba(200,220,255,.8);
  transform-origin:0 50%;
  z-index:2;
  width:0;
  animation:dibujar 1s ease-out forwards;
}
@keyframes dibujar{
  from{width:0;}
  to{width:var(--longitud);}
}

.popup{
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,.85);
  padding:22px 28px;
  border-radius:14px;
  font-size:1.2rem;
  max-width:80%;
  text-align:center;
  z-index:10;
  cursor:pointer;
}
.oculto{display:none;}
</style>
</head>
<body>

<div class="contenido">
  <h1>Nuestro universo ✨</h1>
  <p>Algo solo y único para ti.<br>Poco a poco, estrella por estrella 💫</p>
</div>

<!-- 🎵 LYRA -->
<div class="estrella especial" id="l1" style="top:18%;left:50%;" data-message="Tu luz siempre destaca ✨"></div>
<div class="estrella especial" id="l2" style="top:26%;left:47%;" data-message="Todo vibra contigo"></div>
<div class="estrella especial" id="l3" style="top:26%;left:53%;" data-message="Nuestra melodía sigue"></div>
<div class="estrella especial" id="l4" style="top:34%;left:52%;" data-message="Cada nota me recuerda a ti"></div>
<div class="estrella especial" id="l5" style="top:34%;left:46%;" data-message="Eres mi canción favorita 🎵"></div>

<!-- 🦢 CYGNUS -->
<div class="estrella especial" id="c1" style="top:52%;left:22%;" data-message="Eres mi estrella guía 💙"></div>
<div class="estrella especial" id="c2" style="top:44%;left:18%;" data-message="Siempre vuelvo a ti"></div>
<div class="estrella especial" id="c3" style="top:36%;left:14%;" data-message="Incluso lejos, te siento cerca"></div>
<div class="estrella especial" id="c4" style="top:28%;left:11%;" data-message="Tu luz me guía"></div>
<div class="estrella especial" id="c5" style="top:60%;left:24%;" data-message="Nuestro camino continúa"></div>
<div class="estrella especial" id="c6" style="top:68%;left:24%;" data-message="Mi lugar seguro"></div>
<div class="estrella especial" id="c7" style="top:52%;left:12%;" data-message="Tus alas me abrazan"></div>
<div class="estrella especial" id="c8" style="top:52%;left:32%;" data-message="Siempre me encuentras"></div>
<div class="estrella especial" id="c9" style="top:60%;left:32%;" data-message="Todo se conecta"></div>
<div class="estrella especial" id="c10" style="top:68%;left:32%;" data-message="Mi universo eres tú"></div>

<!-- 🦅 AQUILA (CORREGIDA, NO TELARAÑA) -->
<div class="estrella especial" id="a1" style="top:52%;left:78%;" data-message="Contigo vuelo más alto 🦅"></div>
<div class="estrella especial" id="a2" style="top:46%;left:80%;" data-message="Me haces sentir libre"></div>
<div class="estrella especial" id="a3" style="top:40%;left:82%;" data-message="Tu luz me guía"></div>

<div class="estrella especial" id="a4" style="top:58%;left:70%;" data-message="Siempre regreso"></div>
<div class="estrella especial" id="a5" style="top:64%;left:64%;" data-message="Mi cielo favorito eres tú"></div>

<div class="estrella especial" id="a6" style="top:58%;left:86%;" data-message="Tus alas me cuidan"></div>
<div class="estrella especial" id="a7" style="top:64%;left:92%;" data-message="Eres mi destino"></div>

<div class="estrella especial" id="a8" style="top:50%;left:72%;" data-message="Siempre contigo"></div>
<div class="estrella especial" id="a9" style="top:50%;left:84%;" data-message="Siempre aquí"></div>

<div id="popup" class="popup oculto">
  <p id="popup-text"></p>
</div>

<script>
// fondo estrellas
for(let i=0;i<140;i++){
  const e=document.createElement("div");
  e.className="estrella";
  const s=Math.random()*2+1;
  e.style.width=s+"px";
  e.style.height=s+"px";
  e.style.top=Math.random()*100+"vh";
  e.style.left=Math.random()*100+"vw";
  e.style.animationDuration=(Math.random()*3+1)+"s";
  document.body.appendChild(e);
}

const popup=document.getElementById("popup");
const popupText=document.getElementById("popup-text");

// 🔗 CONEXIONES (arregladas)
const conexiones=[
  // Lyra
  ["l2","l3"],["l3","l4"],["l4","l5"],["l5","l2"],
  ["l1","l3"],

  // Cisne
  ["c1","c2"],["c2","c3"],["c3","c4"],
  ["c1","c5"],["c5","c6"],
  ["c1","c7"],["c1","c8"],["c8","c9"],["c9","c10"],

  // Aquila (forma ave real)
  ["a1","a2"],["a2","a3"],   // cabeza
  ["a1","a4"],["a4","a5"],   // ala izquierda
  ["a1","a6"],["a6","a7"],   // ala derecha
  ["a1","a8"],               // hombro izq
  ["a1","a9"]                // hombro der
];

let tocadas=new Set();
let lineas=new Set();

document.querySelectorAll(".estrella.especial").forEach(e=>{
  e.addEventListener("click",()=>{
    if(tocadas.has(e.id)) return;

    tocadas.add(e.id);
    e.classList.add("activa");

    popupText.textContent=e.dataset.message;
    popup.classList.remove("oculto");

    conexiones.forEach(([a,b])=>{
      const key=[a,b].sort().join("-");
      if(tocadas.has(a)&&tocadas.has(b)&&!lineas.has(key)){
        lineas.add(key);
        conectar(document.getElementById(a),document.getElementById(b));
      }
    });
  });
});

popup.onclick=()=>popup.classList.add("oculto");

function conectar(a,b){
  const r1=a.getBoundingClientRect();
  const r2=b.getBoundingClientRect();

  const x1=r1.left+r1.width/2;
  const y1=r1.top+r1.height/2;
  const x2=r2.left+r2.width/2;
  const y2=r2.top+r2.height/2;

  const dx=x2-x1, dy=y2-y1;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const ang=Math.atan2(dy,dx)*180/Math.PI;

  const l=document.createElement("div");
  l.className="linea";
  l.style.setProperty("--longitud",dist+"px");
  l.style.left=x1+"px";
  l.style.top=y1+"px";
  l.style.transform=`rotate(${ang}deg)`;
  document.body.appendChild(l);
}
</script>

</body>
</html>

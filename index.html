<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro universo</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Arial',sans-serif;
}
body{
  height:100vh;
  background:radial-gradient(circle at bottom,#070b1f,#00010a);
  overflow:hidden;
  color:white;
}

/* Texto arriba */
.contenido{
  position:absolute;
  top:40px;
  width:100%;
  text-align:center;
  z-index:2;
  pointer-events:none;
}
h1{font-size:2.8rem;margin-bottom:10px;}
p{font-size:1.2rem;opacity:.85;}

/* estrellas fondo */
.estrella{
  position:absolute;
  background:white;
  border-radius:50%;
  opacity:.7;
  animation:parpadeo 2s infinite alternate;
}
@keyframes parpadeo{
  from{opacity:.3;}
  to{opacity:1;}
}

/* estrellas especiales */
.estrella.especial{
  width:7px;
  height:7px;
  background:#e6f2ff;
  border-radius:50%;
  position:absolute;
  cursor:pointer;
  z-index:3;
  box-shadow:0 0 6px rgba(180,220,255,.9),
             0 0 12px rgba(120,180,255,.6);
  animation:latido 2.5s infinite ease-in-out;
}
@keyframes latido{
  0%,100%{transform:scale(1);opacity:.9;}
  50%{transform:scale(1.25);opacity:1;}
}
.estrella.especial.activa{
  background:#fff;
  box-shadow:0 0 10px #fff,
             0 0 20px rgba(200,220,255,1);
}

/* líneas */
.linea{
  position:absolute;
  height:1.2px;
  background:rgba(200,220,255,.8);
  transform-origin:0 50%;
  z-index:2;
  width:0;
  animation:dibujar 1s ease-out forwards;
  box-shadow:0 0 6px rgba(180,200,255,.6);
}
@keyframes dibujar{
  from{width:0;}
  to{width:var(--longitud);}
}

/* popup */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,.85);
  padding:22px 28px;
  border-radius:14px;
  font-size:1.2rem;
  max-width:80%;
  text-align:center;
  z-index:10;
  cursor:pointer;
}
.oculto{display:none;}
</style>
</head>

<body>

<div class="contenido">
  <h1>Nuestro universo ✨</h1>
  <p>Algo solo y único para ti.<br>Poco a poco, estrella por estrella 💫</p>
</div>

<div class="estrella especial" id="l1" data-message="Vega (Lira) 💙" style="top:20%; left:70%;"></div>
<div class="estrella especial" id="l2" style="top:25%; left:67%;"></div>
<div class="estrella especial" id="l3" style="top:25%; left:73%;"></div>
<div class="estrella especial" id="l4" style="top:30%; left:68%;"></div>
<div class="estrella especial" id="l5" style="top:30%; left:72%;"></div>

<div class="estrella especial" id="c1" data-message="Deneb (Cisne) 🦢" style="top:15%; left:25%;"></div>
<div class="estrella especial" id="c2" style="top:30%; left:30%;"></div>
<div class="estrella especial" id="c3" style="top:45%; left:35%;"></div>
<div class="estrella especial" id="c4" style="top:30%; left:20%;"></div>
<div class="estrella especial" id="c5" style="top:30%; left:40%;"></div>

<div class="estrella especial" id="a1" data-message="Altair (Águila) 🦅" style="top:65%; left:50%;"></div>
<div class="estrella especial" id="a2" style="top:60%; left:45%;"></div>
<div class="estrella especial" id="a3" style="top:70%; left:55%;"></div>

<div id="popup" class="popup oculto">
  <p id="popup-text"></p>
</div>

<script>
/* fondo estrellas (CÓDIGO ORIGINAL SIN CAMBIOS) */
for(let i=0;i<120;i++){
  const e=document.createElement("div");
  e.className="estrella";
  const s=Math.random()*2+1;
  e.style.width=s+"px";
  e.style.height=s+"px";
  e.style.top=Math.random()*100+"vh";
  e.style.left=Math.random()*100+"vw";
  e.style.animationDuration=(Math.random()*3+1)+"s";
  document.body.appendChild(e);
}

const popup=document.getElementById("popup");
const popupText=document.getElementById("popup-text");

/* NUEVAS CONEXIONES PARA LAS 3 CONSTELACIONES */
const conexiones=[
  // Lira (Caja debajo de Vega)
  ["l1","l2"], ["l1","l3"], ["l2","l4"], ["l4","l5"], ["l5","l3"],
  
  // Cisne (Cruz)
  ["c1","c2"], ["c2","c3"], // Cuerpo vertical
  ["c2","c4"], ["c2","c5"], // Alas
  
  // Águila (Triángulo abierto/Alas)
  ["a1","a2"], ["a1","a3"]
];

let tocadas=new Set();
let lineasHechas=new Set();

document.querySelectorAll(".estrella.especial").forEach(e=>{
  e.addEventListener("click",()=>{

    if(tocadas.has(e.id)) return;

    tocadas.add(e.id);
    e.classList.add("activa");

    if(e.dataset.message){
      popupText.textContent=e.dataset.message;
      popup.classList.remove("oculto");
    }

    conexiones.forEach(([a,b])=>{
      const clave=[a,b].sort().join("-");
      if(tocadas.has(a)&&tocadas.has(b)&&!lineasHechas.has(clave)){
        lineasHechas.add(clave);
        conectar(
          document.getElementById(a),
          document.getElementById(b)
        );
      }
    });

    // Ahora son 13 estrellas en total (5 Lira + 5 Cisne + 3 Águila)
    if(tocadas.size===13){
      setTimeout(()=>{
        popupText.textContent="✨ Cielo completado: Lira, Cisne y Águila";
        popup.classList.remove("oculto");
      },700);
    }

  });
});

popup.onclick=()=>popup.classList.add("oculto");

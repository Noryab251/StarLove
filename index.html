<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuestro universo</title>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at bottom, #070b1f, #00010a);
      overflow: hidden;
      color: white;
    }

    /* Texto principal (arriba) */
    .contenido {
      position: absolute;
      top: 40px;
      width: 100%;
      text-align: center;
      z-index: 2;
      pointer-events: none;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.85;
    }

    /* Estrellas normales (fondo) */
    .estrella {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: parpadeo 2s infinite alternate;
    }

    @keyframes parpadeo {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    /* ⭐ Estrellas especiales (clickeables) */
    .estrella.especial {
  width: 7px;
  height: 7px;
  background: #e6f2ff;
  border-radius: 50%;
  position: absolute;
  cursor: pointer;
  z-index: 3;
  box-shadow:
    0 0 6px rgba(180,220,255,0.9),
    0 0 12px rgba(120,180,255,0.6);
  animation: latido 2.5s infinite ease-in-out;
}
@keyframes latido {
  0%, 100% {
    transform: scale(1);
    opacity: 0.9;
  }
  50% {
    transform: scale(1.25);
    opacity: 1;
  }
}
    .estrella.especial:hover {
      transform: scale(1.4);
      box-shadow: 0 0 25px white;
    }

    .estrella.especial.activa {
  background: #ffffff;
  box-shadow:
    0 0 10px #ffffff,
    0 0 20px rgba(200,220,255,1);
}


    /* Líneas entre estrellas */
    .linea {
  position: absolute;
  height: 1.2px;
  background: rgba(200, 220, 255, 0.8);
  transform-origin: 0 50%;
  z-index: 2;
  width: 0;
  animation: dibujar 1s ease-out forwards;
  box-shadow: 0 0 6px rgba(180,200,255,0.6);
}

@keyframes dibujar {
  from { width: 0; }
  to { width: var(--longitud); }
}

@keyframes dibujar {
  from {
    width: 0;
  }
  to {
    width: var(--longitud);
  }
}


    /* Popup */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85);
      padding: 22px 28px;
      border-radius: 14px;
      font-size: 1.2rem;
      max-width: 80%;
      text-align: center;
      z-index: 10;
      cursor: pointer;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>

  <!-- Texto principal -->
  <div class="contenido">
    <h1>Nuestro universo ✨</h1>
    <p>
      Algo solo y único para ti.<br>
      Poco a poco, estrella por estrella 💫
    </p>
  </div>

  <!-- 🦢 CONSTELACIÓN DEL CISNE -->
<div class="estrella especial" id="c1" style="top:45%; left:50%;" data-message="El corazón del Cisne ✨"></div>

<div class="estrella especial" id="c2" style="top:35%; left:45%;"></div>
<div class="estrella especial" id="c3" style="top:28%; left:37%;"></div>
<div class="estrella especial" id="c4" style="top:28%; left:27%;"></div>

<div class="estrella especial" id="c5" style="top:35%; left:58%;"></div>
<div class="estrella especial" id="c6" style="top:25%; left:65%;"></div>
<div class="estrella especial" id="c7" style="top:18%; left:72%;"></div>

<div class="estrella especial" id="c8" style="top:55%; left:58%;"></div>
<div class="estrella especial" id="c9" style="top:65%; left:65%;"></div>

  <!-- Popup -->
  <div id="popup" class="popup oculto">
    <p id="popup-text"></p>
  </div>

  <script>
    /* Fondo de estrellas */
    const cantidad = 120;
    for (let i = 0; i < cantidad; i++) {
      const estrella = document.createElement("div");
      estrella.className = "estrella";
      const size = Math.random() * 2 + 1;
      estrella.style.width = size + "px";
      estrella.style.height = size + "px";
      estrella.style.top = Math.random() * 100 + "vh";
      estrella.style.left = Math.random() * 100 + "vw";
      estrella.style.animationDuration = (Math.random() * 3 + 1) + "s";
      document.body.appendChild(estrella);
    }

   /* ===== CONSTELACIÓN REAL DEL CISNE ===== */

const especiales = document.querySelectorAll(".estrella.especial");
const popup = document.getElementById("popup");
const popupText = document.getElementById("popup-text");

/* conexiones reales del cisne */
const conexiones = [
  ["c1","c2"],
  ["c2","c3"],
  ["c3","c4"],

  ["c1","c5"],
  ["c5","c6"],
  ["c6","c7"],

  ["c1","c8"],
  ["c8","c9"]
];

let tocadas = new Set();
let lineasHechas = new Set();

especiales.forEach(e => {
  e.addEventListener("click", () => {

    if (tocadas.has(e.id)) return;

    tocadas.add(e.id);
    e.classList.add("activa");

    if (e.dataset.message) {
      popupText.textContent = e.dataset.message;
      popup.classList.remove("oculto");
    }

    /* conectar SOLO vecinos reales */
    conexiones.forEach(([a,b]) => {

      const key = [a,b].sort().join("-");

      if (
        tocadas.has(a) &&
        tocadas.has(b) &&
        !lineasHechas.has(key)
      ) {
        lineasHechas.add(key);

        conectar(
          document.getElementById(a),
          document.getElementById(b)
        );
      }
    });

    /* constelación completa */
    if (tocadas.size === 9) {
      setTimeout(() => {
        popupText.textContent =
          "🦢 Constelación del Cisne completada";
        popup.classList.remove("oculto");
      }, 700);
    }
  });
});

popup.addEventListener("click", () => {
  popup.classList.add("oculto");
});

}

// Si ya están todas, cierra la constelación
if (activadas.length === totalConstelacion) {
  setTimeout(() => {
    conectar(activadas[activadas.length - 1], activadas[0]);
  }, 1000); // mismo tiempo que la animación de la línea
}

      });
    });

    popup.addEventListener("click", () => {
      popup.classList.add("oculto");
    });

    function conectar(a, b) {
  const rect1 = a.getBoundingClientRect();
  const rect2 = b.getBoundingClientRect();

  const x1 = rect1.left + rect1.width / 2;
  const y1 = rect1.top + rect1.height / 2;
  const x2 = rect2.left + rect2.width / 2;
  const y2 = rect2.top + rect2.height / 2;

  const dx = x2 - x1;
  const dy = y2 - y1;
  const distancia = Math.sqrt(dx * dx + dy * dy);
  const angulo = Math.atan2(dy, dx) * 180 / Math.PI;

  const linea = document.createElement("div");
  linea.className = "linea";
  linea.style.setProperty("--longitud", distancia + "px");
  linea.style.left = x1 + "px";
  linea.style.top = y1 + "px";
  linea.style.transform = `rotate(${angulo}deg)`;

  document.body.appendChild(linea);
}
const totalConstelacion = especiales.length;

  </script>

</body>
</html>

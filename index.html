<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuestro primer sitio</title>

  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at bottom, #0b1d3a, #02040f);
      overflow: hidden;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Contenedor del texto */
    .contenido {
      z-index: 2;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.85;
    }

    /* Estrellas */
    .estrella {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: parpadeo 2s infinite alternate;
    }

    @keyframes parpadeo {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }
  </style>
</head>

<body>

  <div class="contenido">
    <h1>Nuestro universo ✨</h1>
    <p>Algo solo y unico para ti.<br>
    Poco a poco lo convertiremos en algo increíble.</p>
  </div>

  <!-- Estrellas -->
  <script>
    const cantidad = 120;

    for (let i = 0; i < cantidad; i++) {
      const estrella = document.createElement("div");
      estrella.className = "estrella";

      const size = Math.random() * 2 + 1;
      estrella.style.width = size + "px";
      estrella.style.height = size + "px";

      estrella.style.top = Math.random() * 100 + "vh";
      estrella.style.left = Math.random() * 100 + "vw";

      estrella.style.animationDuration = (Math.random() * 3 + 1) + "s";

      document.body.appendChild(estrella);
    }
  </script>

</body>
</html>

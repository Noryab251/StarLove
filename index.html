<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestro universo</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  background: radial-gradient(circle at bottom, #020824, #00010a);
  overflow: hidden;
  color: white;
}

/* Texto inicial */
.contenido {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 2;
}
h1 { font-size: 3rem; }
p { opacity: 0.85; }

/* Estrellas de fondo */
.estrella {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.6;
  animation: parpadeo 2s infinite alternate;
}
@keyframes parpadeo {
  from { opacity: 0.3; }
  to { opacity: 1; }
}

/* Estrellas especiales (constelación) */
.estrella.especial {
  width: 8px;
  height: 8px;
  background: #e8f7ff;
  box-shadow: 0 0 12px #9fdcff;
  cursor: pointer;
  z-index: 3;
}
.estrella.especial.activa {
  background: #b8ecff;
  box-shadow: 0 0 18px #b8ecff;
}

/* Líneas */
.linea {
  position: absolute;
  height: 1.5px;
  background: rgba(160,220,255,0.8);
  transform-origin: 0 50%;
  z-index: 1;
}

/* Popup */
.popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.85);
  padding: 20px 30px;
  border-radius: 14px;
  font-size: 1.2rem;
  z-index: 10;
}
.oculto { display: none; }
</style>
</head>

<body>

<div class="contenido">
  <h1>Nuestro universo ✨</h1>
  <p>Un cielo hecho con calma,<br>estrella por estrella.</p>
</div>

<!-- Constelación del Cisne -->
<div class="estrella especial" style="top:25%; left:50%;" data-id="a"></div>
<div class="estrella especial" style="top:35%; left:48%;" data-id="b"></div>
<div class="estrella especial" style="top:45%; left:46%;" data-id="c"></div>
<div class="estrella especial" style="top:55%; left:48%;" data-id="d"></div>
<div class="estrella especial" style="top:65%; left:50%;" data-id="e"></div>

<!-- Popup -->
<div id="popup" class="popup oculto">
  <p id="popup-text"></p>
</div>

<script>
/* Fondo de estrellas */
const cantidad = 120;
for (let i = 0; i < cantidad; i++) {
  const estrella = document.createElement("div");
  estrella.className = "estrella";

  const size = Math.random() * 2 + 1;
  estrella.style.width = size + "px";
  estrella.style.height = size + "px";
  estrella.style.top = Math.random() * 100 + "vh";
  estrella.style.left = Math.random() * 100 + "vw";
  estrella.style.animationDuration = (Math.random() * 3 + 1) + "s";

  document.body.appendChild(estrella);
}

/* Estrellas especiales */
const especiales = document.querySelectorAll(".estrella.especial");
const totalConstelacion = especiales.length;

const popup = document.getElementById("popup");
const popupText = document.getElementById("popup-text");

let activadas = [];

especiales.forEach(e => {
  e.addEventListener("click", () => {

    if (e.classList.contains("activa")) return;

    popupText.textContent = e.dataset.message;
    popup.classList.remove("oculto");

    e.classList.add("activa");
    activadas.push(e);

    /* conecta con la anterior */
    if (activadas.length > 1) {
      conectar(activadas[activadas.length - 2], e);
    }

    /* cerrar constelación cuando estén todas */
    if (activadas.length === totalConstelacion) {
      setTimeout(() => {
        conectar(activadas[activadas.length - 1], activadas[0]);

        setTimeout(() => {
          popupText.textContent =
            "✨ La constelación está completa… y también algo dentro de mí 💙";
          popup.classList.remove("oculto");
        }, 900);

      }, 1000);
    }

  });
});

popup.addEventListener("click", () => {
  popup.classList.add("oculto");
});

/* función de conexión */
function conectar(a, b) {

  const rect1 = a.getBoundingClientRect();
  const rect2 = b.getBoundingClientRect();

  const x1 = rect1.left + rect1.width / 2;
  const y1 = rect1.top + rect1.height / 2;
  const x2 = rect2.left + rect2.width / 2;
  const y2 = rect2.top + rect2.height / 2;

  const dx = x2 - x1;
  const dy = y2 - y1;
  const distancia = Math.sqrt(dx * dx + dy * dy);
  const angulo = Math.atan2(dy, dx) * 180 / Math.PI;

  const linea = document.createElement("div");
  linea.className = "linea";
  linea.style.setProperty("--longitud", distancia + "px");
  linea.style.left = x1 + "px";
  linea.style.top = y1 + "px";
  linea.style.transform = `rotate(${angulo}deg)`;

  document.body.appendChild(linea);
}
</script>


</body>
</html>
